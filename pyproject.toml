[build-system]
requires = ["setuptools>=68.0,<77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mtft"
version = "0.18.0"
description = "Modular Time Field Theory — falsifiability engine, modular geometry, gauge-Higgs unification, dark sector, LHC confrontation, information geometry, arithmetic computation, and sonification."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Roger Tano"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["physics", "modular-forms", "gauge-theory", "dark-matter", "information-geometry", "falsifiability", "busy-beaver", "computability", "sonification"]

dependencies = [
    "numpy>=1.22",
    "mpmath>=1.3",
]

[project.optional-dependencies]
full = ["scipy>=1.9", "matplotlib>=3.5"]
viz = ["matplotlib>=3.5", "plotly>=5.0"]
dev = ["pytest>=7.0", "pytest-cov", "ruff"]
lhc = ["uproot>=5.0", "awkward>=2.0"]

[project.urls]
Homepage = "https://github.com/Kaizoku-Ronin/mtft"
Documentation = "https://github.com/Kaizoku-Ronin/mtft#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mtft = ["mtft_legend.md"]
"mtft.canonical" = ["_data/*.txt"]
"mtft.boundary" = ["_data/*.txt"]

[tool.pytest.ini_options]
markers = [
    "slow: opt-in slow certifications (mp-tier suites, > 60 s)",
]

[tool.ruff]
line-length = 100
