name: Interaction atlas and documentation

on:
  pull_request:
    paths:
      - 'src/mtft/**'
      - 'scripts/interactions/**'
      - 'scripts/build_capability_index.py'
      - 'tests/test_interactions.py'
      - 'tests/test_repository_docs.py'
      - 'tests/test_tier11_and_legend.py'
      - 'docs/**'
      - 'README.md'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - '.github/workflows/atlas.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atlas:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev,full]" build
      - run: python -m pytest tests/test_interactions.py tests/test_repository_docs.py tests/test_tier11_and_legend.py tests/test_release_pin.py -q
      - run: python -m build
      - name: Check installed wheel outside the source checkout
        shell: bash
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python -m mtft.interactions summary
          python -m mtft.interactions render -o installed-atlas.html
