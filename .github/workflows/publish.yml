# Publish to PyPI via Trusted Publishing (OIDC — no API tokens).
#
# Trigger: creating a GitHub Release (which release.ps1 already does).
# Flow:    test → build → publish. If any test fails, nothing publishes.
#
# One-time setup required on PyPI (see TRUSTED_PUBLISHING_SETUP.md):
#   pypi.org → project "mtft" → Settings → Publishing → Add publisher
#   owner: Kaizoku-Ronin   repo: mtft   workflow: publish.yml   environment: pypi

name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify version matches release tag (guards the v0.7.2 failure mode)
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          INIT=$(python3 -c "import re;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"',open('src/mtft/__init__.py').read()).group(1))")
          CFF=$(python3 -c "import re;print(re.search(r'^version:\s*(\S+)',open('CITATION.cff').read(),re.M).group(1))")
          echo "tag=$TAG pyproject=$PKG __init__=$INIT CITATION=$CFF"
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$INIT" ] || [ "$TAG" != "$CFF" ]; then
            echo "::error::Version mismatch — bump pyproject.toml, __init__.py, CITATION.cff to $TAG before releasing"
            exit 1
          fi

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest sympy scipy
          # sympy: exact rational algebra in the studies engines
          # (x0143_particle_box Manin-symbol internals) exercised by
          # tests/test_x0143_particle_box.py — a test dependency of the
          # publish gate, not of the wheel itself.
          # scipy (v0.11.1): quadrature in
          # test_pet_f1_modular_degree_certification — likewise a
          # publish-gate test dependency only (wheel deps unchanged).

      - name: Run test suite (publish is blocked if this fails)
        run: python -m pytest tests/ -q

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build

      - name: Validate distributions
        run: |
          pip install twine
          python -m twine check dist/*

      - name: Verify the sdist reproduces the release gate (v0.11.2 lesson)
        run: |
          python -c "import tarfile, glob; tarfile.open(glob.glob('dist/*.tar.gz')[0]).extractall('/tmp/sdist_repro')"
          cd /tmp/sdist_repro/mtft-* && python -m pytest tests/test_x0143_particle_box.py -q

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: test-and-build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mtft/
    permissions:
      id-token: write   # this line is what enables Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: false  # duplicates must FAIL LOUDLY (v0.7.2 lesson:
                                # true + unbumped version = silent green no-op)
